[package]
name = "vibec"
version = "0.1.0"
edition = "2024"
description = "Bootstrap compiler for Vibe, an agent-first scientific language"
publish = false

[dependencies]
ciborium = "0.2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "vibec"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
